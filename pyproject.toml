[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prcast"
version = "0.1.0"
description = "Causal reliability-controlled structured forecasting"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "torch==2.1.2",
]

[tool.setuptools.packages.find]
include = ["prcast*"]
